name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Frontend (Vite) — built with `npm run build`, output to `dist`.
          app_location: "/"
          output_location: "dist"
          # Managed Functions proxy holding the GolfCourseAPI key server-side.
          api_location: "api"
        env:
          # NOTE: intentionally NO VITE_GOLF_API_KEY here — production runs in
          # proxy mode so the key is never inlined into the client bundle. The
          # key lives as the GOLF_API_KEY application setting on the SWA (set it
          # in the Portal or with `az staticwebapp appsettings set`).
          NODE_VERSION: "20"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request (tear down preview)
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
